name: Auto Promote main -> master

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote-master:
    name: main -> master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main master --prune

      - name: Check diff main -> master
        id: diff
        run: |
          if git diff --quiet origin/master origin/main; then
            echo "needs_pr=false" >> $GITHUB_OUTPUT
            echo "master already up-to-date with main"
          else
            echo "needs_pr=true" >> $GITHUB_OUTPUT
            echo "master needs promotion from main"
            git log --oneline origin/master..origin/main --no-merges | head -20
          fi

      - name: Create PR main -> master
        if: steps.diff.outputs.needs_pr == 'true'
        id: create
        run: |
          existing=$(gh pr list --base master --head main --state open --json number --jq length)
          if [ "$existing" != "0" ]; then
            echo "PR already exists main->master"
            PR=$(gh pr list --base master --head main --state open --json number --jq '.[0].number')
            echo "pr=$PR" >> $GITHUB_OUTPUT
            exit 0
          fi
          PR_URL=$(gh pr create --base master --head main --title "auto: main → master" --body "Automated promotion after merge to main.

          Flow: dev → main → master (auto-merged)
          Trigger: push to main ${{ github.sha }})
          echo "Created $PR_URL"
          PR=$(gh pr list --base master --head main --state open --json number --jq '.[0].number')
          echo "pr=$PR" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto approve PR
        if: steps.diff.outputs.needs_pr == 'true'
        run: |
          PR=${{ steps.create.outputs.pr }}
          if [ -z "$PR" ]; then PR=$(gh pr list --base master --head main --state open --json number --jq '.[0].number'); fi
          echo "Approving PR #$PR"
          gh pr review $PR --approve --body "auto-approved promotion main → master" || echo "approve failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge PR
        if: steps.diff.outputs.needs_pr == 'true'
        run: |
          PR=${{ steps.create.outputs.pr }}
          if [ -z "$PR" ]; then PR=$(gh pr list --base master --head main --state open --json number --jq '.[0].number'); fi
          echo "Merging PR #$PR main -> master"
          gh pr merge $PR --merge --delete-branch=false || gh pr merge $PR --auto --merge
          echo "Merged main -> master"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
